<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>14DNA Advanced</title><style>:root{--bg:#07090d;--panel:#11151c;--line:#29313d;--text:#f2f4f6;--muted:#9ba4af;--accent:#b8ff2c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:680px;margin:auto}h1{font-size:42px;line-height:.95;letter-spacing:-.05em}p{color:var(--muted);line-height:1.65}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}label{display:block;font-size:12px;color:var(--muted);margin:14px 0 7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);background:#0b0f15;color:var(--text);padding:12px;font-size:16px}textarea{min-height:110px}button{margin-top:16px;background:var(--accent);color:#071000;border:0;font-weight:900}.back{display:inline-block;color:var(--accent);text-decoration:none;margin-bottom:10px}.status{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}</style></head><body><main><a class="back" href="./">← 通常作成へ</a><h1>高度生成</h1><p>Remotion動画、FLUX画像、LTX動画をスマホからローカルRender Nodeへ送信します。処理時間と上限はPCのGPU・VRAMに依存します。</p><section class="card"><label>テーマ</label><textarea id="theme"></textarea><label>見出し</label><input id="headline"><label>形式</label><select id="format"><option value="reels">Reels 9:16</option><option value="story">Story 9:16</option><option value="x_vertical">X縦 9:16</option><option value="x_landscape">X横 16:9</option><option value="square">正方形 1:1</option></select><label>生成エンジン</label><select id="mode"><option value="template_video">Remotion + FFmpeg MP4</option><option value="flux_local">ComfyUI + FLUX.1 schnell</option><option value="ltx_video_local">ComfyUI + LTX-Video</option></select><label>秒数</label><input id="seconds" type="number" min="3" max="60" value="10"><label>LTX入力画像のPC内パス</label><input id="imagePath" placeholder="runtime/uploads/source.png"><button id="send">無料ローカル生成を開始</button><p id="status" class="status"></p></section></main><script>const settings=()=>JSON.parse(localStorage.getItem('14dna-settings-v4')||'{}');const status=document.getElementById('status');document.getElementById('send').onclick=async()=>{try{const s=settings();if(!s.url)throw new Error('通常画面の設定からRender Node URLを登録してください');const body={theme:theme.value,headline:headline.value,format:format.value,mode:mode.value,seconds:Number(seconds.value),imagePath:imagePath.value,seed:`mobile-advanced-${Date.now()}`};const r=await fetch(`${s.url.replace(/\/$/,'')}/api/jobs`,{method:'POST',headers:{'content-type':'application/json',...(s.token?{authorization:`Bearer ${s.token}`}:{})},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);status.textContent=`Job ${j.id} を送信しました。通常画面の生成状況から確認できます。`;localStorage.setItem('14dna-last-job',j.id)}catch(e){status.textContent=e.message}};</script></body></html>
