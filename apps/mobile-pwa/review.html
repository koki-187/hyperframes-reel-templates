<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>14DNA Quality Review</title>
<style>
:root{--bg:#07090d;--panel:#11151c;--line:#29313d;--text:#f2f4f6;--muted:#9ba4af;--accent:#b8ff2c;--danger:#ff6b6b;--review:#f6c85f}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:760px;margin:auto}h1{font-size:clamp(40px,10vw,64px);line-height:.94;letter-spacing:-.055em;margin:18px 0 12px}h2{font-size:21px;margin:0 0 12px}.lead,.notice{color:var(--muted);line-height:1.65}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 7px}input,select,textarea,button{width:100%;min-height:50px;border-radius:13px;border:1px solid var(--line);background:#0b0f15;color:var(--text);padding:12px;font-size:16px}input[type=range]{padding:0;accent-color:var(--accent)}button{font-weight:900}.primary{background:var(--accent);color:#071000;border:0}.secondary{background:transparent}.danger{border-color:#ff6b6b66;color:var(--danger);background:#ff6b6b12}.back{display:inline-block;color:var(--accent);text-decoration:none}.status{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{font-size:11px;border-radius:999px;padding:6px 10px;background:#b8ff2c1c;color:var(--accent)}.pill.review{color:var(--review);background:#f6c85f1c}.pill.error{color:var(--danger);background:#ff6b6b1c}.score-row{display:grid;grid-template-columns:118px 1fr 42px;align-items:center;gap:10px;margin:10px 0}.value{font-variant-numeric:tabular-nums;text-align:right}.candidate{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}.result{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.hidden{display:none!important}@media(max-width:560px){.two{grid-template-columns:1fr}.score-row{grid-template-columns:96px 1fr 38px}}
</style>
</head>
<body><main>
<a class="back" href="./">← 作成画面へ</a>
<h1>Quality Review</h1>
<p class="lead">RELEASE 88点以上、全7軸70点以上、重大エラー0件だけを完成品として公開します。</p>
<section class="card">
<label for="job-id">Job ID</label><input id="job-id" autocomplete="off" placeholder="UUID"><div class="grid two"><button id="load" class="secondary">ジョブを取得</button><button id="use-last" class="secondary">直近ジョブを使用</button></div>
<p id="job-message" class="notice"></p>
</section>
<section id="candidate-card" class="card hidden"><div class="status"><h2>候補情報</h2><span id="job-pill" class="pill review">review_required</span></div><div id="candidate" class="candidate"></div></section>
<section id="review-form" class="card hidden"><h2>7軸評価</h2><p class="notice">見た目が整っているだけでは承認しません。参考画像水準、構図の緊張感、素材の証拠性まで評価してください。</p><div id="scores"></div>
<h2>参考画像との差分</h2><div class="grid two"><label>参考画像を使用<select id="reference-provided"><option value="true">使用した</option><option value="false">使用していない</option></select></label><label>参考画像必須<select id="reference-required"><option value="true">必須</option><option value="false">任意</option></select></label></div><div class="grid two"><label>構図特性<input id="reference-composition" type="number" min="0" max="100" value="80"></label><label>素材表現<input id="reference-material" type="number" min="0" max="100" value="80"></label></div><label>情報階層<input id="reference-hierarchy" type="number" min="0" max="100" value="82"></label>
<h2>Premium Signal</h2><div class="grid two"><label>装飾ノイズ<input id="noise" type="number" min="0" max="100" value="10"></label><label>ネオン依存<input id="neon" type="number" min="0" max="100" value="5"></label><label>テンプレート感<input id="template" type="number" min="0" max="100" value="8"></label><label>汎用アイコン密度<input id="icons" type="number" min="0" max="100" value="12"></label><label>焦点数<input id="focus" type="number" min="1" max="10" value="2"></label><label>余白率<input id="space" type="number" min="0" max="100" value="28"></label><label>制御された非対称<input id="asymmetry" type="number" min="0" max="100" value="82"></label><label>素材の証拠性<input id="material-evidence" type="number" min="0" max="100" value="84"></label></div>
<label>重大エラー・警告（1行1件）</label><textarea id="failures" placeholder="例: QR_NOT_READABLE"></textarea><textarea id="warnings" placeholder="警告（任意）"></textarea>
<button id="submit" class="primary">RELEASE判定を実行</button><p id="review-result" class="result"></p></section>
</main>
<script>
const dimensions=[['concept','Concept'],['composition','Composition'],['hierarchy','Hierarchy'],['materiality','Materiality'],['typography','Typography'],['brand','Brand'],['technical','Technical']];
const $=id=>document.getElementById(id);const tokenKey='14dna-session-token';
function deviceId(){let id=localStorage.getItem('14dna-device-id');if(!id){id=crypto.randomUUID();localStorage.setItem('14dna-device-id',id)}return id}
function connection(){const s=JSON.parse(localStorage.getItem('14dna-settings-v5')||'{}');return{url:(s.url||location.origin).replace(/\/$/,''),token:sessionStorage.getItem(tokenKey)||''}}
function headers(method='GET'){const c=connection(),h={'content-type':'application/json','x-device-id':deviceId()};if(c.token)h.authorization=`Bearer ${c.token}`;if(['POST','PUT','PATCH','DELETE'].includes(method)){h['x-request-timestamp']=String(Date.now());h['x-request-nonce']=crypto.randomUUID()}return h}
async function request(path,options={}){const c=connection();if(!c.token)throw new Error('端末トークンを設定してください');const method=(options.method||'GET').toUpperCase();const r=await fetch(`${c.url}${path}`,{...options,cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',headers:{...headers(method),...(options.headers||{})}});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body={raw:text}}if(!r.ok)throw new Error(body.error||`HTTP ${r.status}`);return body}
const root=$('scores');for(const [id,label] of dimensions){const row=document.createElement('div');row.className='score-row';row.innerHTML=`<label for="score-${id}">${label}</label><input id="score-${id}" type="range" min="0" max="100" value="88"><span id="value-${id}" class="value">88</span>`;root.append(row);const input=row.querySelector('input');input.addEventListener('input',()=>row.querySelector('.value').textContent=input.value)}
function splitLines(value){return value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean)}
function setJob(job){$('candidate-card').classList.remove('hidden');$('review-form').classList.toggle('hidden',job.status!=='review_required');$('job-pill').textContent=job.status;$('job-pill').className=`pill ${job.status==='review_required'?'review':job.status==='rejected'||job.status==='failed'?'error':''}`;$('candidate').textContent=JSON.stringify({id:job.id,mode:job.mode,status:job.status,createdAt:job.createdAt,candidateResult:job.candidateResult,qualityGate:job.qualityGate},null,2);$('job-message').textContent=job.status==='review_required'?'候補は未公開です。品質評価を実行してください。':`現在の状態: ${job.status}`}
async function loadJob(){try{const id=$('job-id').value.trim();if(!id)throw new Error('Job IDを入力してください');setJob(await request(`/api/jobs/${id}`))}catch(e){$('job-message').textContent=e.message}}
$('load').onclick=loadJob;$('use-last').onclick=()=>{$('job-id').value=sessionStorage.getItem('14dna-last-job')||'';loadJob()};
$('submit').onclick=async()=>{try{const id=$('job-id').value.trim();const scores=Object.fromEntries(dimensions.map(([key])=>[key,Number($(`score-${key}`).value)]));const body={minimumLevel:'RELEASE',scores,reference:{provided:$('reference-provided').value==='true',required:$('reference-required').value==='true',compositionSimilarity:Number($('reference-composition').value),materialSimilarity:Number($('reference-material').value),hierarchySimilarity:Number($('reference-hierarchy').value)},premiumSignals:{decorativeNoise:Number($('noise').value),neonDependence:Number($('neon').value),templateFeeling:Number($('template').value),genericIconDensity:Number($('icons').value),visualFocusCount:Number($('focus').value),negativeSpace:Number($('space').value),controlledAsymmetry:Number($('asymmetry').value),materialEvidence:Number($('material-evidence').value)},failures:splitLines($('failures').value),warnings:splitLines($('warnings').value),provenance:{reviewedOn:'mobile-pwa',reviewedAt:new Date().toISOString()}};const job=await request(`/api/jobs/${id}/quality`,{method:'POST',body:JSON.stringify(body)});setJob(job);$('review-result').textContent=JSON.stringify(job.qualityGate,null,2)}catch(e){$('review-result').textContent=e.message}};
const query=new URLSearchParams(location.search);if(query.get('job')){$('job-id').value=query.get('job');loadJob()}else if(sessionStorage.getItem('14dna-last-job'))$('job-id').value=sessionStorage.getItem('14dna-last-job');
</script></body></html>
