name: Validate 14DNA-ENGINE v4

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/super-design-system-v3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON
        run: |
          python -m json.tool apps/mobile-pwa/manifest.webmanifest > /dev/null
          python -m json.tool configs/font-registry-v4.json > /dev/null
          python -m json.tool super-design-system-v3/package.json > /dev/null
          python -m json.tool super-design-system-v3/workflows/comfyui/flux1-schnell.json > /dev/null
          python -m json.tool super-design-system-v3/workflows/comfyui/ltx-image-to-video.json > /dev/null
      - name: Check required mobile, engine and quality files
        run: |
          test -f apps/mobile-pwa/index.html
          test -f apps/mobile-pwa/advanced.html
          test -f apps/mobile-pwa/review.html
          test -f apps/mobile-pwa/sw.js
          test -f apps/mobile-pwa/offline.html
          grep -q '/api/jobs/.*/quality' apps/mobile-pwa/review.html
          grep -q '/api/jobs/.*/regenerate' apps/mobile-pwa/review.html
          grep -q 'previewUrl' apps/mobile-pwa/review.html
          grep -q 'RELEASE 88' apps/mobile-pwa/review.html
          grep -q 'Quality Review' apps/mobile-pwa/advanced.html
          grep -q '/api/previews/' super-design-system-v3/server.mjs
          grep -q 'automaticImageQa' super-design-system-v3/server.mjs
          test -f docs/IMPLEMENTATION_ROADMAP.md
          test -f super-design-system-v3/renderers/social-svg.mjs
          test -f super-design-system-v3/renderers/social-png.mjs
          test -f super-design-system-v3/japanese-typesetting.mjs
          test -f super-design-system-v3/font-manager.mjs
          test -f super-design-system-v3/video/render-video.mjs
          test -f super-design-system-v3/video/ffmpeg.mjs
          test -f super-design-system-v3/video/video-qa.mjs
          test -f super-design-system-v3/adapters/comfyui.mjs
          test -f super-design-system-v3/adapters/ltx-video.mjs
          test -f super-design-system-v3/quality/asset-qa.mjs
          test -f super-design-system-v3/quality/quality-gate.mjs
          test -f super-design-system-v3/quality/reference-profile.mjs
          test -f super-design-system-v3/quality/regeneration.mjs
          test -f super-design-system-v3/tests/asset-qa-test.mjs
          test -f super-design-system-v3/tests/quality-gate-test.mjs
          test -f super-design-system-v3/tests/operational-flow-test.mjs
          test -f super-design-system-v3/tests/server-smoke-test.mjs
          test -f super-design-system-v3/docs/QUALITY_STANDARD.md
          test -f super-design-system-v3/docs/QUALITY_REVIEW_WORKFLOW.md
          test -f super-design-system-v3/desktop/START_14DNA_TAILSCALE.command
          test -f super-design-system-v3/desktop/START_14DNA_TAILSCALE.ps1
      - name: Prevent committed font binaries
        run: |
          if find . -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) | grep -q .; then
            echo 'Font binaries must not be committed to the repository.'
            exit 1
          fi
      - name: Check public files for secrets
        run: |
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|ANTHROPIC_API_KEY=|OPENAI_API_KEY=|github_pat_|ghp_)' apps pages docs configs --exclude='*.md' 2>/dev/null; then
            echo 'Potential secret detected.'
            exit 1
          fi
      - name: Install engine dependencies
        working-directory: super-design-system-v3
        run: npm install --no-audit --no-fund
      - name: Run engine, media, quality and authenticated API tests
        working-directory: super-design-system-v3
        env:
          DNA_ALLOW_FONT_FALLBACK: 'true'
          DNA_REQUIRE_PREMIUM_GATE: 'true'
        run: npm test
