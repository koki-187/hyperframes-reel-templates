name: Validate 14DNA-ENGINE v4

on:
  pull_request:
  push:
    branches:
      - feature/super-design-system-v3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: super-design-system-v3/package-lock.json
      - name: Validate JSON
        run: |
          python -m json.tool apps/mobile-pwa/manifest.webmanifest > /dev/null
          python -m json.tool configs/font-registry-v4.json > /dev/null
          python -m json.tool motion-dna-14.json > /dev/null
          python -m json.tool color-palettes-14.json > /dev/null
      - name: Check required mobile files
        run: |
          test -f apps/mobile-pwa/index.html
          test -f apps/mobile-pwa/sw.js
          test -f apps/mobile-pwa/offline.html
          test -f docs/IMPLEMENTATION_ROADMAP.md
          test -f super-design-system-v3/renderers/social-svg.mjs
          test -f super-design-system-v3/font-manager.mjs
      - name: Prevent committed font binaries
        run: |
          if find . -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) | grep -q .; then
            echo 'Font binaries must not be committed to the repository.'
            exit 1
          fi
      - name: Check public files for secrets
        run: |
          if grep -RInE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|ANTHROPIC_API_KEY=|OPENAI_API_KEY=)' apps pages docs configs --exclude='*.md' 2>/dev/null; then
            echo 'Potential secret detected.'
            exit 1
          fi
      - name: Install engine dependencies
        working-directory: super-design-system-v3
        run: npm install --ignore-scripts
      - name: Run engine tests
        working-directory: super-design-system-v3
        run: npm test
