name: Deploy 14DNA-ENGINE Public Gate

on:
  push:
    branches: [main]
    paths:
      - 'apps/public-gate/**'
      - '.github/workflows/super-design-system-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_PATH: apps/public-gate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public gate
        run: |
          set -euo pipefail
          test -f "$SITE_PATH/index.html"
          grep -q 'PRIVATE SYSTEM' "$SITE_PATH/index.html"
          if grep -RInE '(DNA_RENDER_TOKEN|OPENAI_API_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY|AIza|sk-|github_pat_|ghp_)' "$SITE_PATH"; then
            echo 'Sensitive value or secret-shaped text detected in public gate.'
            exit 1
          fi

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R "$SITE_PATH"/. _site/
          touch _site/.nojekyll
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '%s\n' "${GITHUB_SHA}" > _site/deployed-commit.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy access-restricted gate
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployment output
        run: |
          set -euo pipefail
          test -n "${{ steps.deployment.outputs.page_url }}"
          echo "Published gate: ${{ steps.deployment.outputs.page_url }}"

  report:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment result to Issue #2
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          body=$(cat <<EOF
          ## GitHub Pages セキュリティ監査

          - Public content: access-restricted gate only
          - Commit: ${GITHUB_SHA}
          - Build: ${BUILD_RESULT}
          - Deploy: ${DEPLOY_RESULT}
          - URL: ${PAGE_URL:-未取得}
          - Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "$body"
