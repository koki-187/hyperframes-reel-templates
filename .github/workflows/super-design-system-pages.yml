name: Deploy 14DNA-ENGINE Mobile PWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-pwa/**'
      - 'super-design-system-v3/scripts/generate-pwa-icons.mjs'
      - '.github/workflows/super-design-system-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_PATH: apps/mobile-pwa

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install icon dependency
        working-directory: super-design-system-v3
        run: npm install --ignore-scripts

      - name: Generate PWA icons
        working-directory: super-design-system-v3
        run: npm run icons

      - name: Validate Pages source
        run: |
          set -euo pipefail
          test -f "$SITE_PATH/index.html"
          test -f "$SITE_PATH/advanced.html"
          test -f "$SITE_PATH/manifest.webmanifest"
          test -f "$SITE_PATH/sw.js"
          test -f "$SITE_PATH/offline.html"
          test -f "$SITE_PATH/icons/icon-192.png"
          test -f "$SITE_PATH/icons/icon-512.png"
          test -f "$SITE_PATH/icons/maskable-512.png"

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R "$SITE_PATH"/. _site/
          touch _site/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > _site/deployed-commit.txt
          find _site -maxdepth 2 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure GitHub Pages site exists and uses Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          code=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")

          if [ "$code" = "404" ]; then
            create_code=$(curl -sS -o /tmp/pages-create.json -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"build_type":"workflow"}')
            cat /tmp/pages-create.json || true
            test "$create_code" = "201"
          else
            cat /tmp/pages-get.json || true
            test "$code" = "200"
            update_code=$(curl -sS -o /tmp/pages-update.json -w '%{http_code}' \
              -X PUT \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api" \
              -d '{"build_type":"workflow"}')
            cat /tmp/pages-update.json || true
            test "$update_code" = "204"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment output
        run: |
          set -euo pipefail
          test -n "${{ steps.deployment.outputs.page_url }}"
          echo "Published: ${{ steps.deployment.outputs.page_url }}"

  report:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment result to Issue #2
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## GitHub Pages 自動監査

          - Commit: ${GITHUB_SHA}
          - Build: ${BUILD_RESULT}
          - Deploy: ${DEPLOY_RESULT}
          - URL: ${PAGE_URL:-未取得}
          - Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "$body"
