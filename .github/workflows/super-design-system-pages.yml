name: Deploy 14DNA-ENGINE Mobile PWA

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-pwa/**'
      - 'super-design-system-v3/scripts/generate-pwa-icons.mjs'
      - '.github/workflows/super-design-system-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_PATH: apps/mobile-pwa

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install icon dependency
        working-directory: super-design-system-v3
        run: npm install --ignore-scripts

      - name: Generate PWA icons
        working-directory: super-design-system-v3
        run: npm run icons

      - name: Validate Pages source
        run: |
          set -euo pipefail
          test -f "$SITE_PATH/index.html"
          test -f "$SITE_PATH/advanced.html"
          test -f "$SITE_PATH/manifest.webmanifest"
          test -f "$SITE_PATH/sw.js"
          test -f "$SITE_PATH/offline.html"
          test -f "$SITE_PATH/icons/icon-192.png"
          test -f "$SITE_PATH/icons/icon-512.png"
          test -f "$SITE_PATH/icons/maskable-512.png"

      - name: Build Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R "$SITE_PATH"/. _site/
          touch _site/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > _site/deployed-commit.txt
          find _site -maxdepth 2 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment output
        run: |
          test -n "${{ steps.deployment.outputs.page_url }}"
          echo "Published: ${{ steps.deployment.outputs.page_url }}"
